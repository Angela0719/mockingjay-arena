<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yidan Wang 王怡丹 · 个人主页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#ece6f4; --space:#c9b9e6; --gold:#7a5c1e; --cream:#3d1a6e; --white:#2e1358;
  --line:rgba(43,33,64,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--space);color:var(--white);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden}
::selection{background:var(--gold);color:var(--space)}
a{color:inherit;text-decoration:none}
.serif{font-family:'Marcellus','Songti SC','STSong','SimSun',serif}
.zh{color:rgba(46,19,88,.38);font-size:.68em;letter-spacing:.08em;font-weight:400}
.zhs{display:block;font-size:9.5px;letter-spacing:.18em;color:rgba(46,19,88,.38);margin-top:4px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}

/* ===== 顶部导航 ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;
  padding:22px 4vw;mix-blend-mode:normal;transition:background .4s;
  background:linear-gradient(180deg,rgba(201,185,230,.55),transparent);}
nav.solid{background:rgba(201,185,230,.96);border-bottom:1px solid rgba(43,33,64,.08)}
nav .brand{font-size:13px;letter-spacing:.28em;color:var(--cream)}
nav .brand b{font-weight:600}
nav .links{display:flex;gap:28px;font-size:12px;letter-spacing:.2em;color:rgba(40,22,80,.66)}
nav .links a{transition:color .25s}
nav .links a:hover{color:var(--cream)}

/* ===== HERO 地球 ===== */
#hero{position:relative;height:100vh;min-height:640px;overflow:hidden}
#globeWrap{position:absolute;inset:0;cursor:grab;touch-action:pan-y}
#globeWrap:active{cursor:grabbing}
#heroGlow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 55% at 68% 50%,rgba(79,38,131,.14),transparent 65%);}
.heroUI{position:absolute;left:4vw;top:55vh;z-index:10;pointer-events:none;max-width:620px}
.kicker{font-size:12px;letter-spacing:.34em;color:var(--gold);margin-bottom:18px}
.heroUI h1{font-size:clamp(30px,3.8vw,52px);line-height:1.05;font-weight:400;color:var(--white)}
.heroUI h1 .en{display:block;font-size:.32em;letter-spacing:.42em;color:rgba(79,38,131,.72);margin-top:14px}
.tagline{margin-top:22px;font-size:15px;line-height:1.9;color:rgba(40,22,80,.75);max-width:30em}
.tagline em{font-style:normal;color:var(--cream)}
.stats{display:flex;gap:28px;margin-top:10px;border-top:1px solid var(--line);pointer-events:none}
.stats .st{flex:1;padding:14px 0 4px}
.stats .st b{display:block;font-family:'Marcellus',serif;font-weight:400;font-size:clamp(36px,3.8vw,52px);color:var(--cream);line-height:1}
.stats .st span{display:block;margin-top:9px;font-size:12px;letter-spacing:.18em;color:rgba(40,22,80,.62);white-space:nowrap}
.legend{position:absolute;right:4vw;bottom:5vh;z-index:10;font-size:11px;letter-spacing:.12em;color:rgba(40,22,80,.6);line-height:2;text-align:right;pointer-events:none}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.scrollHint{position:absolute;left:50%;bottom:3.4vh;transform:translateX(-50%);z-index:10;
  font-size:11px;letter-spacing:.3em;color:rgba(79,38,131,.6);animation:hint 2.6s ease-in-out infinite;pointer-events:none}
@keyframes hint{0%,100%{transform:translate(-50%,0);opacity:.55}50%{transform:translate(-50%,8px);opacity:1}}

/* ===== 作品集（首屏内嵌） ===== */
.worksUI{position:absolute;left:4vw;right:4vw;bottom:5.5vh;z-index:10;max-width:780px}
.secHead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.secHead h2{font-size:12px;letter-spacing:.34em;color:var(--gold);font-weight:400}
.secHead h2 .zh{font-size:9.5px;color:rgba(46,19,88,.38);letter-spacing:.14em}
.secHead span{font-size:11px;letter-spacing:.18em;color:rgba(43,33,64,.45)}
.work{display:flex;flex-wrap:wrap;align-content:center;gap:6px 14px;padding:22px 0 14px;border-bottom:1px solid var(--line);position:relative;transition:padding-left .45s cubic-bezier(.19,1,.22,1)}
.work:hover{padding-left:14px}
.work .num{font-size:11px;letter-spacing:.3em;color:var(--gold);flex:none}
.work h3{font-family:'Marcellus','Songti SC','STSong',serif;font-weight:400;font-size:clamp(19px,1.65vw,24px);line-height:1.2;color:var(--white);transition:color .3s;flex:none;min-width:0;flex-basis:100%}
.work:hover h3{color:var(--cream)}
.work p{font-size:13px;line-height:1.5;color:rgba(40,22,80,.72);flex:1;min-width:0;flex-basis:100%}
.work p .zhs{display:inline;margin-left:8px;font-size:9.5px;color:rgba(46,19,88,.38)}
.work h3 .zh{font-size:9.5px;letter-spacing:.14em}
.work .go{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-family:'Marcellus',serif;font-size:22px;color:var(--gold);opacity:0;transition:opacity .3s}
.work:hover .go{opacity:1}
.work.soon{opacity:.42;cursor:default}
.work.soon:hover{padding-left:0}
.work .badge{display:inline-block;margin-left:10px;vertical-align:middle;font-size:9px;letter-spacing:.2em;color:var(--gold);
  border:1px solid rgba(175,145,95,.5);border-radius:999px;padding:3px 9px}


.workList{max-height:134px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;touch-action:pan-y;overscroll-behavior:contain;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.workList::-webkit-scrollbar{display:none}
.moreHint{display:none;margin-top:6px;font-size:9.5px;letter-spacing:.3em;color:var(--gold);opacity:.55;text-align:right;animation:hint 2.6s ease-in-out infinite}
.moreHint.show{display:block}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(3px);opacity:.8}}
/* 作品排序 */
.secHead{position:relative;justify-content:flex-start;gap:16px}
.arrBtn{flex:none;margin-left:auto;background:none;border:none;
  font-size:11px;color:var(--gold);padding:2px 4px;cursor:pointer;opacity:.22;transition:opacity .3s}
.arrBtn:hover{opacity:.7}
.arrBtn.on{opacity:.8}
.pwRow{display:none;justify-content:flex-end;gap:8px;padding:8px 0 2px}
.pwRow.show{display:flex}
.pwRow input{width:130px;background:rgba(255,255,255,.55);border:1px solid rgba(122,92,30,.35);border-radius:6px;
  font-size:16px;letter-spacing:.3em;color:var(--gold);padding:5px 10px;outline:none;text-align:center}
.pwRow input::placeholder{color:rgba(122,92,30,.3)}
.pwRow button{background:none;border:1px solid rgba(122,92,30,.45);border-radius:6px;color:var(--gold);
  font-size:16px;padding:5px 12px;cursor:pointer}
.pwRow.err input{border-color:#b0492f;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.arrBtn .zh{color:inherit;opacity:.7}
.work .mv{display:none;position:absolute;right:2px;top:50%;transform:translateY(-50%);gap:6px;z-index:5}
.worksUI.editing .work .mv{display:flex}
.worksUI.editing .work{cursor:default;padding-right:64px}
.worksUI.editing .work:hover{padding-left:0}
.worksUI.editing .work .go{display:none}
.work .mv button{width:24px;height:24px;border-radius:50%;border:1px solid rgba(122,92,30,.5);background:rgba(255,255,255,.7);
  color:var(--gold);font-size:12px;line-height:1;cursor:pointer}
.work .mv button:disabled{opacity:.25;cursor:default}

/* ===== 关于 ===== */
#about{background:var(--navy);padding:12vh 4vw 14vh}
.aboutGrid{max-width:1200px}
.aboutGrid h2{font-size:13px;letter-spacing:.34em;color:var(--gold);font-weight:400;margin-bottom:5vh}
.aboutGrid p.big{font-family:'Marcellus','Songti SC','STSong',serif;font-size:clamp(20px,2.4vw,32px);line-height:1.9;color:rgba(43,33,64,.85);max-width:26em}
.aboutGrid p.big em{font-style:normal;color:var(--cream)}
.sign{margin-top:7vh;padding-top:4vh;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:baseline}
.sign .who{font-size:15px;color:var(--cream);letter-spacing:.06em}
.sign .who small{display:block;margin-top:10px;font-size:11px;letter-spacing:.22em;color:rgba(43,33,64,.5)}
.sign .domain{font-family:'Marcellus',serif;font-size:15px;letter-spacing:.12em;color:var(--gold)}
footer{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:14px 4vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  font-size:10px;letter-spacing:.2em;color:rgba(43,33,64,.4)}

@media(hover:none){
  .work:hover{padding-left:0}
}
@media(min-width:901px){
  .secHead h2{font-size:14px}
  .secHead h2 .zh{font-size:10px}
  .kicker{font-size:14px}
  .kicker .zh{font-size:10px}
  .fpTitle{font-size:14px !important;letter-spacing:.34em !important}
  .worksUI{max-width:920px}
  .work{padding:25px 0 16px}
  .work h3{font-size:clamp(21px,1.8vw,26px);white-space:nowrap}
  .work h3 .zh{font-size:10.5px}
  .work p{font-size:14px;line-height:1.55;margin-top:2px}
  .work p .zhs{font-size:10.5px}
  .work .badge{font-size:10px;padding:3px 9px}
  .work .go{font-size:25px}
  .workList{max-height:160px}
}
@media(max-width:760px){
  nav .brand{font-size:11px}
  nav .zh{color:rgba(245,238,220,.55);font-size:.85em}
  nav .brand{color:#f5e8ce}
  nav>.mono{color:#f5e8ce !important}
  nav>.mono{font-size:10px !important;letter-spacing:.18em !important}
  .heroUI{top:40vh;max-width:88vw}
  .stats{flex-wrap:nowrap}
  .stats .st b{font-size:30px;color:#f5e8ce}
  .stats .st span{color:rgba(245,238,220,.8)}
  .stats .zhs{color:rgba(245,238,220,.55)}
  .stats{border-top-color:rgba(245,238,220,.3)}
  .heroUI .mono{color:#e8c96a !important}
  .secHead h2{color:#3d1a6e;font-weight:600}
  .stats .st span{font-size:11px;letter-spacing:.1em}
  .secHead h2 .zh{font-size:8.5px}
  .heroUI .zh{font-size:8.5px !important;color:rgba(245,238,220,.55) !important}
  .stats .zhs{font-size:8.5px}
  .legend{display:none}
  nav .links{gap:16px;font-size:11px}
  .stats{gap:12px}
  .worksUI{bottom:3.2vh}
  .workList{max-height:232px;display:block}
  .work{gap:6px 10px;padding:17px 0 7px;align-content:center}
  .work .go{position:static;transform:none;margin-left:auto}
  .work h3{font-size:24px}
  .work h3{min-width:0}
  .work{flex-wrap:wrap}
  .work p{flex-basis:100%;margin-top:0;font-size:12px;line-height:1.55}
  .work p .zhs,.work h3 .zh{font-size:8.5px}
  .secHead>span{display:none}
  #heroGlow{background:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(79,38,131,.12),transparent 65%)}
}
</style>
</head>

function ll(lat,lng,r){
  const phi=(90-lat)*Math.PI/180, th=(lng+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(th));
}

function glowTex(){

  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');

  return new THREE.CanvasTexture(c);
}

// 端点金星（无锡 · 伦敦，同等亮度，对相脉动）
function mkStar(lat,lng){
  const s=new THREE.Mesh(new THREE.SphereGeometry(2.1,16,16),new THREE.MeshBasicMaterial({color:0xd9a520}));
  s.position.copy(ll(lat,lng,R*1.01)); world.add(s);
  const h=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:0xd9a520,transparent:true,opacity:.85,depthWrite:false}));
  h.position.copy(s.position); h.scale.set(14,14,1); world.add(h);
  return h;
}
const haloL=mkStar(LONDON[0],LONDON[1]);
const haloW=mkStar(WUXI[0],WUXI[1]);

// 极圈光环
function ring(lat){
  const pts=[]; for(let a=0;a<=128;a++){pts.push(ll(lat,a/128*360-180,R*1.002));}
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  world.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0x8a6d33,transparent:true,opacity:.45})));
}
ring(66.56); ring(-66.56);

// 金色求学弧线 江苏无锡 → 加拿大伦敦
const arcPts = (()=>{
  const a=ll(WUXI[0],WUXI[1],R), b=ll(LONDON[0],LONDON[1],R);
  const mid=a.clone().add(b).multiplyScalar(.5).normalize().multiplyScalar(R*1.55);
  return new THREE.QuadraticBezierCurve3(a,mid,b).getPoints(120);
})();
const arcGeo=new THREE.BufferGeometry().setFromPoints(arcPts);
const arc=new THREE.Line(arcGeo,new THREE.LineBasicMaterial({color:0xc9962e,transparent:true,opacity:.9}));
world.add(arc);
const arcGlow=new THREE.Line(arcGeo.clone(),new THREE.LineBasicMaterial({color:0x8a6d33,transparent:true,opacity:.3}));
arcGlow.scale.setScalar(1.002); world.add(arcGlow);

// ============ 交互 ============
let rotY=0, rotX=0.28, velY=0.0016, dragging=false, px=0, py=0, idle=0;
const TILT=0.28;
wrap.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;idle=0;});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  velY=(e.clientX-px)*0.004;
  rotY+=velY; rotX=Math.max(-1.1,Math.min(1.1,rotX+(e.clientY-py)*0.0025));
  px=e.clientX;py=e.clientY;
});
addEventListener('pointerup',()=>{dragging=false;});
wrap.addEventListener('pointercancel',()=>{dragging=false;});

const clock=new THREE.Clock();
const nav=document.querySelector('nav');
addEventListener('scroll',()=>nav.classList.toggle('solid',scrollY>innerHeight*0.75));
function place(){
  const w=wrap.clientWidth,h=wrap.clientHeight,a=w/h;
  if(w>900){
    const halfTan=Math.tan(THREE.MathUtils.degToRad(21));
    const zV=(100+16+14)/halfTan;          // 垂直放下（球半径+上移+余量）
    const zH=(100+64+14)/(halfTan*a);      // 水平放下（球半径+右移+余量）
    cam.position.z=Math.max(335,zV,zH);    // 宽屏维持原样，方屏自动拉远
    world.position.x=64; world.position.y=16;
  }
  else { world.position.x=0; world.position.y=46; cam.position.z=380; }
}
place();
(function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  if(!dragging){
    idle++;
    velY*=0.94;
    rotY += velY + 0.00035*Math.min(idle/60,1);   // 缓回自转
  }
  world.rotation.y=rotY; world.rotation.x=rotX;
  const s1=13+Math.sin(t*2.6)*3.4; haloL.scale.set(s1,s1,1);
  haloL.material.opacity=.55+Math.sin(t*2.6)*.3;
  const s2=13+Math.sin(t*2.6+Math.PI)*3.4; haloW.scale.set(s2,s2,1);
  haloW.material.opacity=.55+Math.sin(t*2.6+Math.PI)*.3;
  arcGeo.setDrawRange(0, 1+Math.floor((t*36)%120)); // 弧线流动
  renderer.render(scene,cam);
})();
addEventListener('resize',()=>{
  cam.aspect=wrap.clientWidth/wrap.clientHeight;cam.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth,wrap.clientHeight); place();
});

    box.classList.add('editing');btn.classList.add('on');setBtn();
  });

    if(inp.value==='080719'){
      sessionStorage.setItem('arrOk','1');
      row.classList.remove('show','err');

  };
  document.getElementById('pwGo').addEventListener('click',tryPw);
  document.getElementById('pwIn').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw();});
  const doMove=b=>{
    const w=b.closest('.work');
    if(b.classList.contains('up')){const pr=w.previousElementSibling; if(pr?.classList.contains('work')) list.insertBefore(w,pr);}
    else{const nx=w.nextElementSibling; if(nx?.classList.contains('work')) list.insertBefore(nx,w);}
    save(); refresh();
  };
  // 触摸端：touchend 直接处理，阻止进入链接
  box.addEventListener('touchend',e=>{
    const b=e.target.closest('.mv button');
    if(b){e.preventDefault();e.stopPropagation();doMove(b);return;}
    if(box.classList.contains('editing')&&e.target.closest('.work')){e.preventDefault();e.stopPropagation();}
  },{passive:false});
  box.addEventListener('click',e=>{
    const b=e.target.closest('.mv button');
    if(b){e.preventDefault();e.stopPropagation();doMove(b);return;}
    if(box.classList.contains('editing')&&e.target.closest('.work')){e.preventDefault();e.stopPropagation();}
  },true);
})();
</script>
